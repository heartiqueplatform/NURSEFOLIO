  <!-- ============================================================
       THEME + LOADING SCREEN
       Runs before React mounts. Prevents any flash of wrong color.
       Uses the exact same colors as the app: white / zinc-950.
       ============================================================ -->
  <style>
    /* --- Set base colors that match the app exactly --- */
    html {
      background-color: #ffffff;
    }

    html.dark {
      background-color: #09090b;
    }

    body {
      margin: 0;
      background-color: inherit;
      /* Prevent iOS rubber-band flash revealing a white strip in dark mode */
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* --- Blank loading screen: a soft pulsing dot in the app's accent color --- */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: inherit;
      z-index: 9999;
    }

    /* Three dots — subtle, brand-colored, no text */
    .initial-loader-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .initial-loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #0d9488;
      /* teal-600 — the app accent */
      opacity: 0.4;
      animation: initial-loader-pulse 1.4s ease-in-out infinite;
    }

    .initial-loader-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .initial-loader-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    html.dark .initial-loader-dot {
      background-color: #2dd4bf;
      /* teal-400 — the accent in dark mode */
    }

    @keyframes initial-loader-pulse {

      0%,
      80%,
      100% {
        opacity: 0.4;
        transform: scale(1);
      }

      40% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    /* When React mounts and removes the loader, no gap should show */
    #root {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: inherit;
    }
  </style>

  <!-- Inline script: set theme class BEFORE CSS renders (no flash) -->
  <script>
    (function () {
      try {
        let stored = localStorage.getItem('theme-mode');
        if (!stored) {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          stored = prefersDark ? 'dark' : 'light';
          localStorage.setItem('theme-mode', stored);
        }
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // localStorage unavailable — fall through to light
      }
    })();
  </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />
</head>

<body>
  <!-- Blank loading screen — removed automatically once React mounts -->
  <div id="initial-loader" aria-hidden="true">
    <div class="initial-loader-dots">
      <div class="initial-loader-dot"></div>
      <div class="initial-loader-dot"></div>
      <div class="initial-loader-dot"></div>
    </div>
  </div>

  <div id="root"></div>

  <script type="module">
    // Remove the initial loader as soon as React's first paint happens.
    // Using requestAnimationFrame so we don't remove it before content exists.
    import('/src/main.tsx').then(() => {
      // main.tsx has imported and mounted. Queue removal after paint.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.15s ease-out';
            setTimeout(() => loader.remove(), 200);
          }
        });
      });
    });
  </script>
</body>
