  <!-- ============================================================
       THEME BOOTSTRAP
       Runs before React mounts. Prevents any flash of wrong color.
       No loader markup — React's own loader handles UI feedback.
       ============================================================ -->
  <style>
    /* --- Set base colors that match the app exactly --- */
    html {
      background-color: #ffffff;
    }

    html.dark {
      background-color: #09090b;
    }

    body {
      margin: 0;
      background-color: inherit;
      /* Prevent iOS rubber-band flash revealing a white strip in dark mode */
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: inherit;
    }
  </style>

  <!-- Inline script: set theme class BEFORE CSS renders (no flash) -->
  <script>
    (function () {
      try {
        let stored = localStorage.getItem('theme-mode');
        if (!stored) {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          stored = prefersDark ? 'dark' : 'light';
          localStorage.setItem('theme-mode', stored);
        }
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // localStorage unavailable — fall through to light
      }
    })();
  </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
